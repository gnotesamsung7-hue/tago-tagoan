plugins { id 'com.android.application' }
android {
    namespace 'com.markdave.tagotagoan'
    compileSdk 34
    defaultConfig {
        applicationId 'com.markdave.tagotagoan'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        tago {
            storeFile file('tago.keystore')
            storePassword 'tagotagoan'
            keyAlias 'tago'
            keyPassword 'tagotagoan'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.tago }
        release { minifyEnabled false; signingConfig signingConfigs.tago }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
